name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reproducible cyan portal packs
        run: |
          python3 -m unittest discover -s portal-packs -p 'test_*.py' -v
          python3 portal-packs/build.py --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            event-bridge/pom.xml
            multiverse-inventories-isolated/pom.xml
      - name: Test Paper event bridge
        run: mvn --batch-mode --no-transfer-progress --file event-bridge/pom.xml verify
      - name: Verify isolated Multiverse-Inventories artifact
        run: mvn --batch-mode --no-transfer-progress --file multiverse-inventories-isolated/pom.xml verify
      - name: Validate Docker Compose
        env:
          MINECRAFT_BIND_IP: 127.0.0.1
          MINECRAFT_RCON_PASSWORD: ci-placeholder
        run: docker compose config --quiet
      - name: Check whitespace
        run: git diff --check
