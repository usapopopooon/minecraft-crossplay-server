name: UsapoEventBridge
version: 1.0.0
main: net.usapo.eventbridge.UsapoEventBridgePlugin
description: Emits activity for mc-bot and performs atomic resource exchanges.
author: usapo
api-version: '26.2'
commands:
  usapo-event-bridge:
    description: Controls internal mc-bot integration state.
    usage: |-
      /usapo-event-bridge voice-bonus <uuid> <on|off>
      /usapo-event-bridge emerald-diamond-v2 <uuid> <32|64> <request-uuid>
    permission: usapo.eventbridge.control
permissions:
  usapo.eventbridge.control:
    default: op
