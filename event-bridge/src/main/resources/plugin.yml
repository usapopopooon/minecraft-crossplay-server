name: UsapoEventBridge
version: 1.0.0
main: net.usapo.eventbridge.UsapoEventBridgePlugin
description: Emits activity for mc-bot and performs atomic resource exchanges.
author: usapo
api-version: '26.2'
softdepend: [floodgate]
commands:
  exchange:
    description: Opens the Minecraft exchange menu.
    usage: /exchange [xp|resource|emerald-diamond|buyback|balance]
    permission: usapo.exchange.use
  gacha:
    description: Opens the Minecraft item gacha.
    usage: /gacha [normal|rare|<resource|adventure|equipment> <normal|rare>]
    aliases: [itemgacha]
    permission: usapo.gacha.use
  market:
    description: Opens the player item market using server XP.
    usage: /market [list|sell|buy|mine|cancel|claim|balance]
    aliases: [fleamarket]
    permission: usapo.market.use
  quest:
    description: Opens the player delivery quest board.
    usage: /quest [list|create|confirm|discard|mine|accept|submit|abandon|cancel|claim]
    aliases: [quests]
    permission: usapo.quest.use
  usapo-event-bridge:
    description: Controls internal mc-bot integration state.
    usage: |-
      /usapo-event-bridge voice-bonus <uuid> <on|off>
      /usapo-event-bridge emerald-diamond-v2 <uuid> <32|64> <request-uuid>
      /usapo-event-bridge market-deliver <listing> <buyer-uuid> <purchase-uuid>
      /usapo-event-bridge market-return <listing> <seller-uuid> <request-uuid>
      /usapo-event-bridge market-mailbox-return <listing> <seller-uuid> <request-uuid>
      /usapo-event-bridge quest-accept <quest> <player-uuid> <player-name-base64> <request-uuid>
      /usapo-event-bridge quest-submit <quest> <player-uuid> <request-uuid>
      /usapo-event-bridge quest-abandon <quest> <player-uuid> <request-uuid>
      /usapo-event-bridge quest-cancel <quest> <player-uuid> <request-uuid>
      /usapo-event-bridge quest-invalidate <quest> <owner-uuid> <request-uuid>
      /usapo-event-bridge quest-admin-create <request-item> <count> <reward-item> <count> <hours> <request-uuid>
      /usapo-event-bridge material-buyback <player-uuid> <item-id> <count> <request-uuid>
      /usapo-event-bridge material-buyback-release <player-uuid> <request-uuid>
      /usapo-event-bridge resource-catalog-sync <revision> <base64url-payload>
      /usapo-event-bridge resource-pack-validate <base64url-payload>
    permission: usapo.eventbridge.control
permissions:
  usapo.exchange.use:
    default: true
  usapo.gacha.use:
    default: true
  usapo.market.use:
    default: true
  usapo.quest.use:
    default: true
  usapo.eventbridge.control:
    default: op
