services:
  minecraft:
    image: itzg/minecraft-server:stable
    restart: unless-stopped
    stop_grace_period: 2m
    tty: true
    stdin_open: true
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: LATEST
      TZ: Asia/Tokyo
      MEMORY: 6G
      USE_AIKAR_FLAGS: "TRUE"
      SERVER_NAME: "${MINECRAFT_SERVER_NAME:-Chill Cafe cross-play server}"
      MOTD: "${MINECRAFT_MOTD:-Chill Cafe cross-play server}"
      MODE: survival
      DIFFICULTY: normal
      MAX_PLAYERS: "20"
      VIEW_DISTANCE: "16"
      SIMULATION_DISTANCE: "4"
      ONLINE_MODE: "TRUE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      OVERRIDE_WHITELIST: "FALSE"
      SPAWN_PROTECTION: "16"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${MINECRAFT_RCON_PASSWORD:?Set the Minecraft RCON password}"
      BROADCAST_RCON_TO_OPS: "FALSE"
      CREATE_CONSOLE_IN_PIPE: "TRUE"
      REMOVE_OLD_MODS: "TRUE"
      REMOVE_OLD_MODS_INCLUDE: "Geyser-Spigot.jar"
      REMOVE_OLD_MODS_DEPTH: "1"
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/2.11.0/builds/1204/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
      MODRINTH_PROJECTS: |
        viaversion
        viabackwards
    ports:
      - "${MINECRAFT_BIND_IP:?Set MINECRAFT_BIND_IP}:25565:25565/tcp"
      - "${MINECRAFT_BIND_IP:?Set MINECRAFT_BIND_IP}:19132:19132/udp"
    volumes:
      - minecraft-data:/data
    networks:
      - default
      - minecraft-control
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 3m
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  minecraft-data:
    name: minecraft-crossplay-data

networks:
  minecraft-control:
    external: true
    name: "${MINECRAFT_CONTROL_NETWORK:-minecraft-control}"
